<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{--bg:#1e1e1e;--font:'Arial',sans-serif;--color:#fff}
    body{align-items:center;justify-content:center;text-align:center;height:100vh;overflow:hidden}
    button{position:relative;margin:0 4px}
    .cred,.ver{position:absolute;bottom:0;padding:8px}
    .ver{left:0}
    .cred{right:0}
    .loader{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:absolute;top:0;left:0;background:var(--bg);color:var(--color);z-index:1000}
    .loader>div{width:200px;height:20px;background:var(--color);border:1px solid var(--color);outline:1px solid #000}
    .loader>div>div{width:0;height:100%;background:#ff4545;transition:width .5s;margin:0;padding:0;margin-bottom:10px}
    .loader>div>span{font-family:var(--font);margin:0;padding:0;font-size:24px}
    .hidden{display:none}
    .noscript{position:absolute;top:0;left:0;width:100%;height:100%;font-family:var(--font);background:var(--bg);color:var(--color);display:flex;align-items:center;justify-content:center;font-size:24px;z-index:1001;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
    .noscript *{margin:0;padding:0}
  </style>
</head>
<body>
  <noscript>
    <div class="noscript">
      <h1>:(</h1>
      <h3>It looks like javascript is disabled / blocked, making yee loader useless.</h3>
    </div>
  </noscript>
  <div class="loader">
    <div>
      <div></div>
      <span>Loading (%)</span>
    </div>
  </div>
  <div class="content hidden">
    <h1>yee loader</h1>
    <button class="btn" id="blob" onclick='load("blob")'>Open Blob</button> 
    <button class="btn" id="blank" onclick='load("blank")'>Open Blank</button> 
    <button class="btn" id="data" onclick='load("data")'>Open Data</button>
  </div>
  <a class="ver hidden">v1.5.2</a> 
  <a class="cred hidden">Made by Colbster937</a>
  <script>
    // [Obfuscated JavaScript logic for loading and checking remote resources]
    const _0x3572db=_0x258c;
    // ... (rest of the obfuscated script)
  </script>
</body>
</html>
